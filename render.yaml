services:
  - type: web
    name: mathpdf-backend
    runtime: python
    region: singapore # hoặc oregon / frankfurt tùy nhu cầu
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python -c \"import pypandoc; pypandoc.download_pandoc()\""
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATALAB_API_KEY
        sync: false
      - key: DATALAB_CONVERT_MODE
        value: accurate
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11.9"

